# This module's wording. Every line can be rewritten in plugins/RainsCore/messages.yml.
elytra:
  look-on: "<green>Your elytra now shows a <white><look></white> chestplate with the wings. Only a look: it still protects like an elytra."
  look-off: "<green>Your elytra shows as plain wings again."
  already: "<gray>Your elytra already looks like that."
  hold-one: "<red>Hold an elytra, or wear one, to change how it looks."
  unknown-look: "<red>There is no look called <white><typed></white>. These are: <white><looks></white>, or <white>none</white>."
  only-a-player: "<red>Only a player wears an elytra."
  usage: "<gray>/elytra <dark_gray>— pick a look · <gray>/elytra look <white>name</white> | none <dark_gray>· <gray>/elytra dog <white>name</white> | none"
  look-lost-prime: "<light_purple>Your elytra look is a Prime perk,</light_purple> <gray>so your wings are plain again. /prime brings it back."
  look-lost: "<gray>Your elytra look is no longer yours to wear, so your wings are plain again."
  prime-only: "<light_purple>Elytra looks are a Prime perk.</light_purple> <gray>Your elytra stays as it is; you can always take a look off."
  dog-look-on: "<green>This dog armour now shows as <white><look></white> on your dog. Only a look: it still protects like dog armour."
  dog-look-off: "<green>This dog armour shows as plain dog armour again."
  dog-already: "<gray>This dog armour already looks like that."
  dog-hold-one: "<red>Hold dog armour in your hand to change how it looks."
  dog-prime-only: "<light_purple>Dog armour looks are a Prime perk.</light_purple> <gray>You can always take a look off."
  dog-lost-prime: "<light_purple>Your dog's armour look is a Prime perk,</light_purple> <gray>so it wears plain armour again. /prime brings it back."
  dog-lost: "<gray>Your dog's armour look is no longer yours to give, so it wears plain armour again."
  not-allowed: "<red>Elytra looks are not open to you here."
