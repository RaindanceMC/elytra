id: elytra
title: Elytra, horse armour & dog looks
summary: Put an armour trim on your elytra at a smithing table, and give it a chestplate look with /elytra.
intro: |
  Your wings deserve a little flair too. Trims go on exactly like they do on armour, and a chestplate look lets your elytra show off a diamond or netherite chestplate — only as a look.
icon: ELYTRA
category: Items & enchantments
order: 45
module: elytra
aliases: [elytra, wings, elytralook, elytra-trims, elytra-looks]
keywords: [elytra, wings, trim, trims, smithing, template, chestplate, look, cosmetic, dog, wolf, dog armour, wolf armor]
commands: [elytra]
sections:
  - question: How do I put a trim on my elytra?
    title: Trims
    text: |
      Use a smithing table as you would for armour: a trim template, your elytra and a trim material (iron, gold, diamond, amethyst, …). The wings show the pattern in the material's colour, and enchantments and the name stay on.
      The server's resource pack draws the trim on the wings; without it the trim is still there and shows in the tooltip.
  - question: Can my horse armour take a trim?
    title: Horse armour trims
    text: |
      Yes, every horse armour (leather, copper, iron, gold, diamond, netherite) takes a trim at a smithing table, just like your own armour: a trim template, the horse armour and a trim material. Every pattern has its own design on the horse.
  - question: How do I get a chestplate look on my elytra?
    title: Chestplate looks
    text: |
      Hold or wear your elytra and type {run:/elytra}. Pick leather, chainmail, copper, iron, gold, diamond or netherite, and your wings are drawn with that chestplate. {cmd:/elytra look none} takes it off again.
      It is only a look: the elytra protects exactly like an elytra, not like the chestplate it shows. A trim shows on the chestplate part too.
      {if:elytra:prime-only}Putting a look on is a <light_purple>Prime</light_purple> perk; everybody can look at them in the menu and take one off.{/if}
  - question: Can my dog look fancy too?
    title: Dog armour looks
    text: |
      Hold dog armour and type {run:/elytra dog}. Pick leather, copper, iron, gold, diamond, netherite or gilded netherite, then put the armour on your dog: it wears that look. {cmd:/elytra dog none} takes it off again.
      It is only a look: the armour protects and wears out like any dog armour, and leather still takes a dye.
      {if:elytra:prime-only}Putting a look on is a <light_purple>Prime</light_purple> perk. When Prime ends, the looks come off your elytra and your dogs' armour by themselves; trims always stay.{/if}
